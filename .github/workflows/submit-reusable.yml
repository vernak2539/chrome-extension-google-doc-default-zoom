name: Submit to Web Store (reusable)

on:
  workflow_call:
    inputs:
      environment:
        description: "GitHub environment that holds the Sentry variables and secrets"
        type: string
        required: true
      edition:
        description: "Edition to build: base or extended"
        type: string
        required: true
      include_firefox:
        description: "Build, release, package and publish the Firefox target"
        type: boolean
        required: true
      chrome_extension_id:
        description: "Chrome Web Store item ID. SUBMIT_ENV's CHROME_EXTENSION_ID must match it."
        type: string
        required: true
      edge_product_id:
        description: "Edge Add-ons product ID. SUBMIT_ENV's EDGE_PRODUCT_ID must match it."
        type: string
        required: true
      firefox_extension_id:
        description: "Firefox add-on ID. Only used when include_firefox is true; SUBMIT_ENV's FIREFOX_EXTENSION_ID must match it."
        type: string
        required: false
        default: ""
      edge_url_prefix:
        type: string
        required: true
      firefox_url_prefix:
        description: "Only used when include_firefox is true"
        type: string
        required: false
        default: ""
      artifact_prefix:
        description: "Prefix of the artifact name (the version is added)"
        type: string
        required: true
    secrets:
      SUBMIT_ENV:
        description: "Not passed by the callers. The value is the secret of the job's environment: the contents of that edition's .env.submit.<edition> file."
        required: false
      SENTRY_AUTH_TOKEN:
        description: "Not passed by the callers. The value is the secret of the job's environment, which takes precedence."
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
    env:
      WXT_SENTRY_DSN: ${{ vars.PLASMO_PUBLIC_SENTRY_DSN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
      # Chrome and Edge publish settings, the same for both editions. `wxt submit` takes a key from `.env.submit`
      # (SUBMIT_ENV) only when it isn't set already, so these win over the secret. The dry run validates them too.
      CHROME_PUBLISH_TYPE: DEFAULT_PUBLISH
      CHROME_DEPLOY_PERCENTAGE: "100"
      CHROME_CANCEL_PENDING: "true"
      CHROME_SKIP_REVIEW: "false"
      CHROME_SKIP_SUBMIT_REVIEW: "false"
      EDGE_SKIP_SUBMIT_REVIEW: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install
      - name: Run Tests
        run: pnpm test
      - name: Check the Firefox edition
        if: ${{ inputs.include_firefox && inputs.edition != 'base' }}
        run: |
          echo "Firefox ships only the Base edition." >&2
          exit 1
      - name: Build and package the extension
        run: |
          pnpm package:${{ inputs.edition }} -b chrome
          pnpm package:${{ inputs.edition }} -b edge
      - name: Build and package the extension (Firefox)
        if: ${{ inputs.include_firefox && inputs.edition == 'base' }}
        run: pnpm package:${{ inputs.edition }} -b firefox
      - name: Check the built edition
        run: pnpm check:editions
      - name: Write the store credentials
        env:
          SUBMIT_ENV: ${{ secrets.SUBMIT_ENV }}
          ENVIRONMENT: ${{ inputs.environment }}
          EDITION: ${{ inputs.edition }}
          INCLUDE_FIREFOX: ${{ inputs.include_firefox }}
          EXPECTED_CHROME_EXTENSION_ID: ${{ inputs.chrome_extension_id }}
          EXPECTED_EDGE_PRODUCT_ID: ${{ inputs.edge_product_id }}
          EXPECTED_FIREFOX_EXTENSION_ID: ${{ inputs.firefox_extension_id }}
        run: node bin/write-submit-env.mjs
      - name: List the zips to submit
        id: zips
        shell: bash
        run: |
          args="--chrome-zip build/chrome-mv3-${{ inputs.edition }}.zip --edge-zip build/edge-mv3-${{ inputs.edition }}.zip"
          if [[ "${{ inputs.include_firefox && inputs.edition == 'base' }}" == "true" ]]; then
            args+=" --firefox-zip build/firefox-mv2-${{ inputs.edition }}.zip"
          fi
          echo "args=$args" >> "$GITHUB_OUTPUT"
      # Signs in to the Chrome Web Store and AMO and reads the listings, without uploading.
      # Edge has no such check. A failure here stops the job before the Sentry release.
      - name: Check the store credentials
        env:
          DRY_RUN: "true"
        run: pnpm exec wxt submit --dry-run ${{ steps.zips.outputs.args }}
      - name: get-npm-version
        id: package-version
        uses: martinbeentjes/npm-get-version-action@v1.3.1
      - name: Create Sentry release (Chrome Extension)
        uses: getsentry/action-release@v1
        with:
          environment: production
          sourcemaps: "./build/chrome-mv3-${{ inputs.edition }}"
          url_prefix: "chrome-extension://${{ inputs.chrome_extension_id }}"
          ignore_empty: true
          ignore_missing: true
          version: ${{ steps.package-version.outputs.current-version }}
      - name: Create Sentry release (Edge Extension)
        uses: getsentry/action-release@v1
        with:
          environment: production
          sourcemaps: "./build/edge-mv3-${{ inputs.edition }}"
          url_prefix: ${{ inputs.edge_url_prefix }}
          ignore_empty: true
          ignore_missing: true
          version: ${{ steps.package-version.outputs.current-version }}
      - name: Create Sentry release (Firefox Add-on)
        if: ${{ inputs.include_firefox && inputs.edition == 'base' }}
        uses: getsentry/action-release@v1
        with:
          environment: production
          sourcemaps: "./build/firefox-mv2-${{ inputs.edition }}"
          url_prefix: ${{ inputs.firefox_url_prefix }}
          ignore_empty: true
          ignore_missing: true
          version: ${{ steps.package-version.outputs.current-version }}
      - name: Submit to the stores
        run: pnpm exec wxt submit ${{ steps.zips.outputs.args }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          path: build
          name: ${{ inputs.artifact_prefix }}-${{ steps.package-version.outputs.current-version }}
