name: Sanity Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the run for the previous push; runs on main are never cancelled
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Format, lint, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Check formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      # Vitest runs every test file once for each edition (see vite.config.ts)
      - name: Run Tests
        run: pnpm test
      # `wxt zip` writes sourcemaps into the build directory and leaves them out of the zip
      # Firefox has no Extended edition, so only Base builds it
      - name: Build and package both editions
        run: |
          pnpm package:base -b chrome
          pnpm package:base -b edge
          pnpm package:base -b firefox
          pnpm package:extended -b chrome
          pnpm package:extended -b edge
      - name: Check the built editions
        run: pnpm check:editions
      - name: Typecheck
        run: pnpm typecheck
      - name: Check bundle size
        run: pnpm bundlesize
        env:
          INTERNAL_SKIP_CACHE: "1"

  # Loads build/chrome-mv3-<edition> against saved Docs and Sheets markup (docs/e2e.md)
  browser-chromium:
    name: Browser tests (Chromium, ${{ matrix.edition }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        edition: [base, extended]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Build
        run: pnpm build:${{ matrix.edition }} -b chrome
      # No --with-deps: the runner image already has Chromium's libraries (it only added fonts), and apt-get's
      # mirrors sometimes take 5 minutes. The harness launches channel "chromium", so the headless shell is unused.
      - name: Install Chromium
        run: pnpm exec playwright install --no-shell chromium
      - name: Browser tests
        run: pnpm test:e2e --project ${{ matrix.edition }}
      # Every browser test leaves a screenshot of its last page, passed or failed
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots-chromium-${{ matrix.edition }}
          path: e2e/results/screenshots
          if-no-files-found: ignore

  # Loads build/firefox-mv2-base (Firefox ships Base only) against the same saved markup
  browser-firefox:
    name: Browser tests (Firefox)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Build
        run: pnpm build:base -b firefox
      # Mozilla's Firefox stable build, driven by Puppeteer: Playwright can't load an extension into Firefox.
      # The runner image has the libraries it needs; Playwright's install-deps only added media codecs.
      - name: Install Firefox
        run: |
          FIREFOX_BIN=$(pnpm exec browsers install firefox@stable --path "$RUNNER_TEMP/browsers" --format '{{path}}')
          echo "FIREFOX_BIN=$FIREFOX_BIN" >> "$GITHUB_ENV"
      - name: Browser tests (Firefox)
        run: pnpm test:e2e:firefox
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots-firefox
          path: e2e/results/screenshots
          if-no-files-found: ignore
