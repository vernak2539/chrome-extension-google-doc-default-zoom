name: Sanity Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install
      - name: Check formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      # Vitest runs every test file once for each edition (see vite.config.ts)
      - name: Run Tests
        run: pnpm test
      # `wxt zip` writes sourcemaps into the build directory and leaves them out of the zip
      # Firefox has no Extended edition, so only Base builds it
      - name: Build and package both editions
        run: |
          pnpm package:base -b chrome
          pnpm package:base -b edge
          pnpm package:base -b firefox
          pnpm package:extended -b chrome
          pnpm package:extended -b edge
      - name: Check the built editions
        run: pnpm check:editions
      - name: Typecheck
        run: pnpm typecheck
      - name: Check bundle size
        run: pnpm bundlesize
        env:
          INTERNAL_SKIP_CACHE: "1"
      - name: Install Chromium for the browser tests
        run: pnpm exec playwright install --with-deps chromium
      # Loads build/chrome-mv3-base and build/chrome-mv3-extended against saved Docs and Sheets markup (docs/e2e.md)
      - name: Browser tests
        run: pnpm test:e2e
      # Mozilla's Firefox stable build, driven by Puppeteer: Playwright can't load an extension into Firefox.
      # Playwright's install-deps adds the system libraries Firefox needs.
      - name: Install Firefox for the browser tests
        run: |
          pnpm exec playwright install-deps firefox
          FIREFOX_BIN=$(pnpm exec browsers install firefox@stable --path "$RUNNER_TEMP/browsers" --format '{{path}}')
          echo "FIREFOX_BIN=$FIREFOX_BIN" >> "$GITHUB_ENV"
      # Loads build/firefox-mv2-base (Firefox ships Base only) against the same saved markup
      - name: Browser tests (Firefox)
        run: pnpm test:e2e:firefox
      # Every browser test leaves a screenshot of its last page, passed or failed, so a reviewer can
      # see what it saw (the two jobs run in sequence, so both sets are here)
      - name: Upload browser test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e/results/screenshots
          if-no-files-found: ignore
