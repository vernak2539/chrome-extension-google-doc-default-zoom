name: E2E live

# Opens the maintainer's public Docs and Sheet signed out, checks both editions against them in Chromium and Base
# in Firefox, and captures fresh fixtures (docs/e2e.md), so a change on Google's side shows up on the next pull request.
# Nothing here signs in to Google or uses a secret. Run it by hand from the Actions tab ("Run workflow").
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the run for the previous push; runs on main are never cancelled
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Each job fails on its own, and fail-fast is off so one failing target does not cancel the others
jobs:
  live-chromium:
    name: Live check (Chromium, ${{ matrix.edition }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        edition: [base, extended]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Build
        run: pnpm build:${{ matrix.edition }} -b chrome
      # No --with-deps: the runner image already has Chromium's libraries, and apt-get's mirrors sometimes take
      # 5 minutes. The harness launches channel "chromium", so the headless shell is unused.
      - name: Install Chromium
        run: pnpm exec playwright install --no-shell chromium
      - name: Live check
        run: pnpm test:e2e:live --project ${{ matrix.edition }}
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-live-screenshots-chromium-${{ matrix.edition }}
          path: e2e/results/screenshots
          if-no-files-found: ignore

  # Firefox ships Base only
  live-firefox:
    name: Live check (Firefox)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Build
        run: pnpm build:base -b firefox
      # Mozilla's Firefox stable build, driven by Puppeteer: Playwright can't load an extension into Firefox
      - name: Install Firefox
        run: |
          FIREFOX_BIN=$(pnpm exec browsers install firefox@stable --path "$RUNNER_TEMP/browsers" --format '{{path}}')
          echo "FIREFOX_BIN=$FIREFOX_BIN" >> "$GITHUB_ENV"
      - name: Live check
        run: pnpm test:e2e:live:firefox
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-live-screenshots-firefox
          path: e2e/results/screenshots
          if-no-files-found: ignore

  # Capture does not load the extension, so there is no build
  capture:
    name: Capture fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Install Chromium
        run: pnpm exec playwright install --no-shell chromium
      - name: Capture fixtures
        run: pnpm e2e:capture
      # Sanitized files only: the raw captures in e2e/results/raw are never uploaded
      - name: Upload fixtures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixtures
          path: e2e/fixtures
          if-no-files-found: ignore
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-live-screenshots-capture
          path: e2e/results/screenshots
          if-no-files-found: ignore
